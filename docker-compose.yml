version: '3.8'

services:
  # 1. Наш сервис SupportPulse
  supportpulse:
    build: .                # Собрать образ из текущего Dockerfile
    ports:
      - "8001:8000"         # Порт 8001 на сервере -> порт 8000 внутри контейнера
    env_file:
      - .env                # Подгружаем ключи из .env
    volumes:
      - ./data:/app/data    # Сохраняем базу данных (SQLite) на сервере (чтобы не терялась при перезапуске)
    restart: always         # Если упадет — перезапускаем автоматически

  # 2. Здесь в будущем будут другие проекты
  # Пример:
  # telegram-bot:
  #   build: ./telegram-bot
  #   ports:
  #     - "8002:8000"